spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/postgres
    username: ${POSTGRES_ADMIN_USERNAME}
    password: ${POSTGRES_ADMIN_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update  # auto-update tables
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_ADMIN_PASSWORD}
  cloud:
    aws:
      # Object storage. Defaults target the in-cluster MinIO (local dev); prod
      # overrides STORAGE_* to point at DO Spaces (see backend deployment env).
      credentials:
        access-key: ${STORAGE_ACCESS_KEY:${MINIO_ADMIN_USERNAME}}
        secret-key: ${STORAGE_SECRET_KEY:${MINIO_ADMIN_PASSWORD}}
      s3:
        endpoint: ${STORAGE_ENDPOINT:http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}}
        path-style-access-enabled: ${STORAGE_PATH_STYLE:true}
      region:
        static: ${STORAGE_REGION:us-east-1}

integration:
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN}
    service-sid: ${TWILIO_SERVICE_SID}
  mocker:
    endpoint: http://${MOCKER_HOST:localhost}:${MOCKER_PORT:8090}

security:
  auth:
    session:
      duration: 24h
    cookie:
      name: AUTH_TOKEN
      secure: false
      same-site: Lax
    rsa:
      public-key: ${RSA_PUBLIC_KEY}
      private-key: ${RSA_PRIVATE_KEY}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui
    enabled: true
  api-docs:
    enabled: true
