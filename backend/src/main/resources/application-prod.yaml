spring:
  config:
    activate:
      on-profile: prod
  datasource:
    jdbc: postgresql://critic-postgresql:5432/postgres
  # Object storage endpoint/creds/region come from STORAGE_* env in prod
  # (DO Spaces); see the backend deployment. No MinIO override here.

security:
  auth:
    cookie:
      secure: true

logging:
  level:
    root: INFO
