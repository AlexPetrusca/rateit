# Reduced deployment preset for a low-cost single-node cluster.
# Keep the app, database, cache, and object storage; drop local-only, ingress-controller,
# and observability workloads so a tiny node has a realistic chance of fitting everything.

nginx:
  replicaCount: 1
  metrics:
    enabled: false
  service:
    type: LoadBalancer

backend:
  replicaCount: 1

localBackend:
  enabled: false

mocker:
  enabled: false

kafka:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

ingress:
  enabled: false

ingress-nginx:
  enabled: false

minio:
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 384Mi
      cpu: 250m

postgresql:
  metrics:
    enabled: false
  primary:
    persistence:
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

redis:
  metrics:
    enabled: false
  master:
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 192Mi
        cpu: 200m
