apiVersion: v2
name: critic-chart
description: A Helm chart for deploying the Critic application

type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: ingress-nginx
    version: "4.x.x"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingress-nginx.enabled
  - name: minio
    version: "5.x.x"
    repository: "https://charts.min.io/"
    condition: minio.enabled
  - name: postgresql
    # Pinned: floating versions drift on each deploy and break the StatefulSet
    # upgrade with immutable-field errors. Must match the deployed STS (18.6.7).
    version: "18.6.7"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "25.5.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: kafka
    version: "32.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
  - name: prometheus
    version: "28.x.x"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "10.x.x"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
  - name: mocker
    version: "1.x.x"
    repository: "oci://ghcr.io/alexpetrusca"
    condition: mocker.enabled
  - name: metrics-server
    version: "3.13.1"
    repository: "https://kubernetes-sigs.github.io/metrics-server/"
    condition: metrics-server.enabled
