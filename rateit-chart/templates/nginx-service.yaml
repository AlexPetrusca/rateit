{{- if .Values.nginx.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: critic-nginx
  labels:
    {{- include "critic.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  selector:
    {{- include "critic.selectorLabels" . | nindent 4 }}
    component: nginx
  ports:
    - port: 80
      targetPort: 80
{{- end }}
