{{- if .Values.nginx.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critic-nginx
  labels:
    {{- include "critic.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      {{- include "critic.selectorLabels" . | nindent 6 }}
      component: nginx
  template:
    metadata:
      labels:
        {{- include "critic.selectorLabels" . | nindent 8 }}
        component: nginx
    spec:
      containers:
        - name: nginx
          image: {{ .Values.nginx.image }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            # Mount an empty directory to overwrite the conf.d directory
            - name: empty-dir
              mountPath: /etc/nginx/conf.d
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.0.0
          args:
            - "-nginx.scrape-uri=http://127.0.0.1:8080/stub_status"
          ports:
            - containerPort: 9113
      volumes:
        - name: nginx-config
          configMap:
            name: critic-nginx-config
        - name: empty-dir
          emptyDir: {}
{{- end }}
