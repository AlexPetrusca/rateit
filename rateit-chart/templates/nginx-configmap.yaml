{{- if .Values.nginx.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: critic-nginx-config
  labels:
    {{- include "critic.selectorLabels" . | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        client_max_body_size 25m;

        map $http_x_forwarded_proto $origin_proto {
            default $http_x_forwarded_proto;
            "" $scheme;
        }

        upstream minio {
            server critic-minio:{{ .Values.minio.service.port }};
            keepalive 32;
        }

        upstream backend {
            server critic-backend:{{ .Values.backend.service.port }};
            keepalive 32;
        }

        {{- if .Values.localBackend.enabled }}
        upstream backend_local {
            server critic-backend-local:{{ .Values.localBackend.service.port }};
            keepalive 32;
        }
        {{- end }}

        # localhost traffic uses the mocker-backed API so local OTP does not hit Twilio.
        {{- if .Values.localBackend.enabled }}
        server {
            listen 80;
            server_name localhost 127.0.0.1 ~^localhost:\d+$ ~^127\.0\.0\.1:\d+$;

            location / {
                rewrite ^/$ /index.html break;
                proxy_pass http://minio/frontend$uri;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_intercept_errors on;
                error_page 404 = /index.html;
            }

            location /images/ {
                proxy_pass http://minio/images/;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
            }

            location /api/ {
                proxy_pass http://backend_local;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                proxy_set_header X-Forwarded-Host $http_host;
            }

            location /auth/ {
                proxy_pass http://backend_local;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                proxy_set_header X-Forwarded-Host $http_host;
            }
        }
        {{- end }}

        # serve public traffic
        server {
            listen 80 default_server;
            server_name app.critic-app.com _;

            location / {
                # If the request is for the root "/", rewrite it to "/index.html"
                rewrite ^/$ /index.html break;

                # Proxy to MinIO, appending the (potentially rewritten) $uri
                proxy_pass http://minio/frontend$uri;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;

                # Handle SPA routing
                #  - If MinIO returns 404 (file not found), serve index.html instead
                #  - This allows the frontend router to handle the path.
                proxy_intercept_errors on;
                error_page 404 = /index.html;
            }

            location /images/ {
                proxy_pass http://minio/images/;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
            }

            location /api/ {
                proxy_pass http://backend;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                proxy_set_header X-Forwarded-Host $http_host;
            }

            location /auth/ {
                proxy_pass http://backend;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                proxy_set_header X-Forwarded-Host $http_host;
            }
        }

        # serve metrics
        server {
            listen 8080;
            location /stub_status {
                stub_status on;
                allow 127.0.0.1;
                deny all;
            }
        }
    }
{{- end }}
