{{- if .Values.nginx.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: critic-nginx-config
  labels:
    {{- include "critic.selectorLabels" . | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        client_max_body_size 25m;

        map $http_x_forwarded_proto $origin_proto {
            default $http_x_forwarded_proto;
            "" $scheme;
        }

        {{- if .Values.minio.enabled }}
        upstream minio {
            server critic-minio:{{ .Values.minio.service.port }};
            keepalive 32;
        }
        {{- end }}

        upstream backend {
            server critic-backend:{{ .Values.backend.service.port }};
            keepalive 32;
        }

        {{- if .Values.localBackend.enabled }}
        upstream backend_local {
            server critic-backend-local:{{ .Values.localBackend.service.port }};
            keepalive 32;
        }
        {{- end }}

        # localhost traffic uses the mocker-backed API so local OTP does not hit Twilio.
        {{- if .Values.localBackend.enabled }}
        server {
            listen 80;
            server_name localhost 127.0.0.1 ~^localhost:\d+$ ~^127\.0\.0\.1:\d+$;

            location / {
                rewrite ^/$ /index.html break;
                proxy_pass http://minio/frontend$uri;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_intercept_errors on;
                error_page 404 = /index.html;
            }

            location /images/ {
                proxy_pass http://minio/images/;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                # Image object keys are unique (timestamp-prefixed) and never mutated,
                # so they can be cached aggressively by the browser.
                proxy_hide_header Cache-Control;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location /api/ {
                proxy_pass http://backend_local;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                proxy_set_header X-Forwarded-Host $http_host;
            }

            location /auth/ {
                proxy_pass http://backend_local;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                proxy_set_header X-Forwarded-Host $http_host;
            }
        }
        {{- end }}

        # serve public traffic
        server {
            listen 80 default_server;
            server_name app.critic-app.com _;
            # Static assets (SPA bundle + image uploads) are served from DO Spaces
            # (critic-media), not MinIO. Variable proxy_pass needs a resolver.
            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
            set $spaces_host critic-media.sfo3.digitaloceanspaces.com;

            location / {
                # If the request is for the root "/", rewrite it to "/index.html"
                rewrite ^/$ /index.html break;

                # Proxy the SPA bundle from Spaces (critic-media/frontend)
                proxy_pass https://$spaces_host/frontend$uri$is_args$args;
                proxy_ssl_server_name on;
                proxy_set_header Host $spaces_host;
                proxy_set_header X-Real-IP $remote_addr;

                # SPA routing: Spaces returns 403 (missing object) or 404 for
                # unknown paths; serve index.html so the client router handles it.
                proxy_intercept_errors on;
                error_page 403 404 = /index.html;
            }

            location /images/ {
                proxy_pass https://$spaces_host$uri$is_args$args;
                proxy_ssl_server_name on;
                proxy_set_header Host $spaces_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                # Image object keys are unique (timestamp-prefixed) and never mutated,
                # so they can be cached aggressively by the browser.
                proxy_hide_header Cache-Control;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location /api/ {
                proxy_pass http://backend;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                proxy_set_header X-Forwarded-Host $http_host;
            }

            location /auth/ {
                proxy_pass http://backend;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $origin_proto;
                proxy_set_header X-Forwarded-Host $http_host;
            }
        }

        # serve metrics
        server {
            listen 8080;
            location /stub_status {
                stub_status on;
                allow 127.0.0.1;
                deny all;
            }
        }
    }
{{- end }}
