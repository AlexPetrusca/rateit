{{- if .Values.backend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critic-backend
  labels:
    {{- include "critic.selectorLabels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  # Recreate (not RollingUpdate) so the old pod is torn down before the new one
  # starts. On the single small prod node, a rolling update briefly runs two
  # backend pods at once, which overcommits memory, wedges the new container, and
  # can flap the node NotReady. Trade a ~30-60s backend blip for a deploy that fits.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "critic.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "critic.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      containers:
        - name: {{ .Chart.Name }}-backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.imageTag }}"
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
          # Bound the JVM so it can't balloon and OOM the whole node (the repeated
          # freezes). The hard memory limit means an over-budget backend is
          # OOM-killed and restarted in isolation instead of taking nginx/Postgres
          # down with it. MaxRAMPercentage sizes the heap to the container limit
          # (not the node's total RAM), so the JVM stays within budget.
          resources:
            requests:
              cpu: "150m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.backend.springProfiles }}"
            - name: SPRING_CONFIG_IMPORT
              value: "configtree:/etc/secrets/"
            - name: POSTGRES_HOST
              value: "critic-postgresql"
            - name: POSTGRES_PORT
              value: "{{ .Values.postgresql.primary.service.ports.postgresql }}"
            - name: POSTGRES_ADMIN_USERNAME
              value: "postgres"
            - name: POSTGRES_USER_USERNAME
              value: "{{ .Values.postgresql.auth.username }}"
            - name: POSTGRES_DB_NAME
              value: "{{ .Values.postgresql.auth.database }}"
            - name: MINIO_HOST
              value: "critic-minio"
            - name: MINIO_PORT
              value: "{{ .Values.minio.service.port }}"
            - name: MOCKER_HOST
              value: "critic-mocker"
            - name: MOCKER_PORT
              value: "{{ .Values.mocker.service.port }}"
            # Object storage -> DO Spaces (critic-media). Creds arrive as files
            # (STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY) via the projected secret below.
            - name: STORAGE_ENDPOINT
              value: "https://sfo3.digitaloceanspaces.com"
            - name: STORAGE_REGION
              value: "sfo3"
            - name: STORAGE_PATH_STYLE
              value: "false"
            - name: STORAGE_IMAGE_BUCKET
              value: "critic-media"
            - name: STORAGE_IMAGE_KEY_PREFIX
              value: "images/"
          volumeMounts:
            - name: secrets-volume
              mountPath: "/etc/secrets"
              readOnly: true
      volumes:
        - name: secrets-volume
          projected:
            sources:
              - secret:
                  name: critic-backend-secret
              - secret:
                  name: critic-postgres-secret
              - secret:
                  name: critic-redis-secret
              - secret:
                  name: critic-minio-secret
                  items:
                    - key: rootUser
                      path: MINIO_ADMIN_USERNAME
                    - key: rootPassword
                      path: MINIO_ADMIN_PASSWORD
              - secret:
                  name: critic-media-secret
                  items:
                    - key: access-key
                      path: STORAGE_ACCESS_KEY
                    - key: secret-key
                      path: STORAGE_SECRET_KEY
{{- end }}
