{{- if and .Values.nginx.enabled .Values.nginx.metrics.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: critic-nginx-metrics
  labels:
    {{- include "critic.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  selector:
    {{- include "critic.selectorLabels" . | nindent 4 }}
    component: nginx
  ports:
    - port: 9113
      targetPort: 9113
{{- end }}
